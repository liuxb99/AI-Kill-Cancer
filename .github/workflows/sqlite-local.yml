name: Local Verification Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-kill-cancer-local-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-verify:
    runs-on: [self-hosted, Windows, X64, ai-ci]
    timeout-minutes: 45
    env:
      APP_MODE: research
      DB_BACKEND: sqlite
      SQLITE_PATH: ./.ci/ai-kill-cancer.db
      MODEL_ENABLED: 'false'
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4

      - name: Select local Python 3.11+
        run: |
          $pythonExe = $null
          $python = Get-Command python -ErrorAction SilentlyContinue
          if ($python) {
            $pythonExe = $python.Source
          }
          if (-not $pythonExe) {
            $py = Get-Command py -ErrorAction SilentlyContinue
            if ($py) {
              $candidate = & cmd /c 'py -3.11 -c "import sys; print(sys.executable)" 2>NUL'
              if ($LASTEXITCODE -eq 0 -and $candidate) {
                $pythonExe = $candidate.Trim()
              }
            }
          }
          if (-not $pythonExe -or -not (Test-Path $pythonExe)) {
            throw 'No usable Python runtime is available on the self-hosted runner.'
          }
          & $pythonExe -c "import sys; assert sys.version_info >= (3, 11), sys.version"
          "PYTHON_EXE=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $pythonExe --version

      - name: Install backend test dependencies
        run: |
          & $env:PYTHON_EXE -m pip install --upgrade pip
          & $env:PYTHON_EXE -m pip install -r src/backend/requirements-api.txt
          & $env:PYTHON_EXE -m pip install pytest pytest-asyncio ruff

      - name: Compile backend
        run: |
          & $env:PYTHON_EXE -m compileall src/backend/config.py src/backend/database src/backend/domain src/backend/api

      - name: Lint backend and SQLite regression
        run: |
          & $env:PYTHON_EXE -m ruff check src/backend tests/backend/test_sqlite_local_compat.py tests/test_analysis_persistence.py
          & $env:PYTHON_EXE -m pytest tests/backend/test_sqlite_local_compat.py tests/test_analysis_persistence.py -v --tb=short

      - name: Initialize configured local SQLite database
        run: |
          @'
          import asyncio
          from src.backend.config import settings
          from src.backend.database.session import close_db, init_db

          async def main():
              await init_db(settings.DATABASE_URL)
              await close_db()

          asyncio.run(main())
          '@ | & $env:PYTHON_EXE -

      - name: Verify local database file
        run: |
          if (-not (Test-Path '.ci/ai-kill-cancer.db')) {
            throw 'SQLite verification database was not created'
          }
          $item = Get-Item '.ci/ai-kill-cancer.db'
          if ($item.Length -le 0) {
            throw 'SQLite verification database is empty'
          }
          Write-Host "SQLite DB bytes: $($item.Length)"

      - name: Diff check
        run: git diff --check
