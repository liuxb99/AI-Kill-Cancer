name: Local Verification Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-kill-cancer-local-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-verify:
    runs-on: [self-hosted, Windows, X64, ai-ci]
    timeout-minutes: 60
    env:
      APP_MODE: research
      DB_BACKEND: sqlite
      SQLITE_PATH: ./.ci/ai-kill-cancer.db
      MODEL_ENABLED: 'false'
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4

      - name: Select local Python 3.10+
        run: |
          $python = Get-Command python -ErrorAction SilentlyContinue
          if (-not $python) { throw 'Python is not available on the self-hosted runner.' }
          $pythonExe = $python.Source
          $version = & $pythonExe -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')"
          & $pythonExe -c "import sys; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)"
          if ($LASTEXITCODE -ne 0) { throw 'Python 3.10+ is required on the self-hosted runner.' }
          $supportsPipeline = (& $pythonExe -c "import sys; print('true' if sys.version_info >= (3, 11) else 'false')").Trim()
          "PYTHON_EXE=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHON_SUPPORTS_PIPELINE=$supportsPipeline" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Python $version; full pipeline tests: $supportsPipeline"

      - name: Install backend verification dependencies
        run: |
          & $env:PYTHON_EXE -m pip install --disable-pip-version-check --prefer-binary `
            "pydantic>=2.10.3" "pydantic-settings>=2.7.0" `
            "sqlalchemy[asyncio]>=2.0.36" "aiosqlite>=0.20.0" `
            "fastapi>=0.115.0" "httpx>=0.28.1" numpy pytest pytest-asyncio ruff

      - name: Compile backend and maintenance scripts
        run: |
          & $env:PYTHON_EXE -m compileall `
            src/backend/config.py src/backend/database src/backend/domain src/backend/api `
            src/backend/adapters src/backend/pipeline src/backend/demo src/backend/research_depth `
            scripts/demo_dataset.py

      - name: Lint release-critical backend and regression tests
        run: |
          & $env:PYTHON_EXE -m ruff check `
            src/backend/adapters `
            src/backend/pipeline/opencravat_adapter.py `
            src/backend/pipeline/vep_adapter.py `
            src/backend/demo/bootstrap.py `
            src/backend/demo/maintenance.py `
            src/backend/research_depth `
            src/backend/api/v1/ptc_research_depth.py `
            src/backend/domain/research_depth.py `
            migrations/versions/030_research_depth_loop.py `
            scripts/demo_dataset.py `
            tests/backend/test_sqlite_local_compat.py `
            tests/backend/test_demo_bootstrap.py `
            tests/backend/test_demo_maintenance.py `
            tests/test_analysis_persistence.py `
            tests/test_release_metadata.py `
            tests/test_code_completeness.py `
            tests/test_demo_validator.py `
            tests/test_sqlite_workspace.py `
            tests/test_workspace_status.py `
            tests/test_traceability_persistence_e2e.py `
            tests/test_research_depth_engine.py `
            tests/test_research_depth_lifecycle.py `
            tests/test_research_depth_persistence.py `
            tests/test_adapters.py `
            tests/test_opencravat_adapter.py `
            tests/test_myvariant_adapter.py `
            tests/test_vep_adapter.py `
            tests/test_oncotree_adapter.py `
            tests/test_drkg_adapter.py `
            tests/test_pharmcat_adapter.py

      - name: Run local-first, completeness, adapter, and research-depth regression suite
        run: |
          & $env:PYTHON_EXE -m pytest `
            tests/backend/test_sqlite_local_compat.py `
            tests/backend/test_demo_bootstrap.py `
            tests/backend/test_demo_maintenance.py `
            tests/test_release_metadata.py `
            tests/test_code_completeness.py `
            tests/test_demo_validator.py `
            tests/test_sqlite_workspace.py `
            tests/test_workspace_status.py `
            tests/test_traceability_persistence_e2e.py `
            tests/test_research_depth_engine.py `
            tests/test_research_depth_lifecycle.py `
            tests/test_research_depth_persistence.py `
            tests/test_adapters.py `
            tests/test_opencravat_adapter.py `
            tests/test_myvariant_adapter.py `
            tests/test_vep_adapter.py `
            tests/test_oncotree_adapter.py `
            tests/test_drkg_adapter.py `
            tests/test_pharmcat_adapter.py `
            -v --tb=short
          if ($env:PYTHON_SUPPORTS_PIPELINE -eq 'true') {
            & $env:PYTHON_EXE -m pytest tests/test_analysis_persistence.py -v --tb=short
          } else {
            Write-Host 'Skipping analysis persistence runtime test on Python 3.10; pipeline runtime requires Python 3.11+.'
          }

      - name: Initialize configured local SQLite database
        run: |
          @'
          import asyncio
          from src.backend.config import settings
          from src.backend.database.session import close_db, init_db

          async def main():
              await init_db(settings.DATABASE_URL)
              await close_db()

          asyncio.run(main())
          '@ | & $env:PYTHON_EXE -

      - name: Verify demo cold-start bootstrap
        env:
          APP_MODE: demo
          DB_BACKEND: sqlite
          SQLITE_PATH: ./.ci/demo-cold-start.db
          DEMO_AUTO_BOOTSTRAP: 'true'
          DEMO_DATA_DIR: ./data/demo
        run: |
          @'
          import asyncio
          from sqlalchemy import func, select
          from src.backend.config import settings
          from src.backend.database import session as db_session
          from src.backend.domain.patient import PatientModel

          async def main():
              await db_session.init_db(settings.DATABASE_URL)
              try:
                  assert db_session.async_session_factory is not None
                  async with db_session.async_session_factory() as session:
                      count = await session.scalar(select(func.count()).select_from(PatientModel))
                      if count != 3:
                          raise RuntimeError(f'Expected 3 bootstrapped demo patients, got {count}')
                  print(f'Demo cold-start bootstrap passed: {count} patients')
              finally:
                  await db_session.close_db()

          asyncio.run(main())
          '@ | & $env:PYTHON_EXE -

      - name: Validate demo maintenance CLI
        run: |
          & $env:PYTHON_EXE scripts/demo_dataset.py validate --data-dir data/demo

      - name: Verify local workspace integrity
        run: |
          @'
          from pathlib import Path
          from src.backend.database.sqlite_workspace import check_sqlite_integrity

          path = Path('.ci/ai-kill-cancer.db')
          if not path.is_file() or path.stat().st_size <= 0:
              raise SystemExit('SQLite verification database missing or empty')
          result = check_sqlite_integrity(path)
          if not result.ok:
              raise SystemExit(f'SQLite integrity failed: {result.message}')
          print(f'SQLite integrity passed: {path.stat().st_size} bytes')
          '@ | & $env:PYTHON_EXE -

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci --force --no-audit --no-fund

      - name: Run frontend tests
        working-directory: src/frontend
        run: npm test -- --reporter=default

      - name: Build frontend
        working-directory: src/frontend
        run: npm run build

      - name: Diff check
        run: git diff --check
