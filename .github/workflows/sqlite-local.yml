name: SQLite Local Compatibility

on:
  push:
    branches: [master]
    paths:
      - 'src/backend/**'
      - 'tests/backend/test_sqlite_local_compat.py'
      - 'src/backend/requirements-api.txt'
      - '.github/workflows/sqlite-local.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src/backend/**'
      - 'tests/backend/test_sqlite_local_compat.py'
      - 'src/backend/requirements-api.txt'
      - '.github/workflows/sqlite-local.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-kill-cancer-sqlite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-local:
    runs-on: [self-hosted, Windows, X64, ai-ci]
    timeout-minutes: 30
    env:
      APP_MODE: research
      DB_BACKEND: sqlite
      SQLITE_PATH: ./.ci/ai-kill-cancer.db
      MODEL_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install backend test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/backend/requirements-api.txt
          python -m pip install pytest pytest-asyncio

      - name: Compile database layer
        run: python -m compileall src/backend/config.py src/backend/database src/backend/domain

      - name: SQLite compatibility regression
        run: python -m pytest tests/backend/test_sqlite_local_compat.py -v --tb=short

      - name: Initialize configured local SQLite database
        shell: pwsh
        run: |
          @'
          import asyncio
          from src.backend.config import settings
          from src.backend.database.session import close_db, init_db

          async def main():
              await init_db(settings.DATABASE_URL)
              await close_db()

          asyncio.run(main())
          '@ | python -

      - name: Verify local database file
        shell: pwsh
        run: |
          if (-not (Test-Path '.ci/ai-kill-cancer.db')) {
            throw 'SQLite CI database was not created'
          }
          $item = Get-Item '.ci/ai-kill-cancer.db'
          if ($item.Length -le 0) {
            throw 'SQLite CI database is empty'
          }
          Write-Host "SQLite DB bytes: $($item.Length)"

      - name: Diff check
        run: git diff --check
