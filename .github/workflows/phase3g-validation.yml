name: Phase 3G Clinical Safety Validation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  clinical-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply deterministic service integration
        run: python scripts/apply_phase3g_safety_integration.py
      - name: Commit generated integration when needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/backend/services/treatment_plan_service.py
            git commit -m "feat(phase3g): enforce safety gate on plan transitions"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements-api.txt
          pip install pytest pytest-asyncio numpy ruff
      - name: Ruff
        run: |
          ruff check \
            src/backend/clinical/treatment_plan_safety_gate.py \
            src/backend/services/treatment_plan_service.py \
            tests/test_phase3g_treatment_plan_safety_gate.py \
            tests/test_phase3g_safety_architecture.py
      - name: Clinical safety and treatment-plan regressions
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: |
          pytest -q \
            tests/test_phase3g_treatment_plan_safety_gate.py \
            tests/test_phase3g_safety_architecture.py \
            tests/backend/services/test_treatment_plan_service.py \
            tests/backend/integration/test_treatment_plan_restart.py \
            tests/backend/atomicity/test_success_path_red.py
