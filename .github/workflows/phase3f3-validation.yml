name: Phase 3F-3 Validation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  recommendation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply deterministic architecture refactor
        run: python scripts/apply_phase3f3_refactor.py
      - name: Commit generated refactor when needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/backend/services/recommendation_service.py src/backend/clinical/report_generator.py
            git commit -m "refactor(recommendation): remove API reverse dependencies"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements-api.txt
          pip install pytest pytest-asyncio numpy ruff
      - name: Lint changed Python files
        run: |
          ruff check \
            src/backend/contracts/recommendation_report.py \
            src/backend/services/recommendation_service.py \
            src/backend/clinical/report_generator.py \
            tests/test_phase3f3_recommendation_contract.py
      - name: Run contract and recommendation regressions
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: |
          pytest -q \
            tests/test_phase3f3_recommendation_contract.py \
            tests/test_explainable_trace.py \
            tests/test_recommendation_service.py \
            tests/test_recommendation_transaction.py
