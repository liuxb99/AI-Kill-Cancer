name: PTC Product Readiness Gate

on:
  push:
    branches: [master]
    paths:
      - "src/backend/services/ptc_readiness_service.py"
      - "src/backend/api/v1/ptc_readiness.py"
      - "src/backend/api/v1/router.py"
      - "tests/backend/services/test_ptc_readiness_service.py"
      - ".github/workflows/ptc-readiness.yml"
  workflow_dispatch:

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements-api.txt
          pip install pytest pytest-asyncio ruff aiosqlite
      - name: Lint readiness production and tests
        run: |
          ruff check \
            src/backend/services/ptc_readiness_service.py \
            src/backend/api/v1/ptc_readiness.py \
            tests/backend/services/test_ptc_readiness_service.py
      - name: Verify API router imports
        env:
          PYTHONPATH: .
        run: python -c "from src.backend.api.v1.router import router; assert any(route.path == '/api/v1/ptc-readiness' for route in router.routes)"
      - name: Run readiness tests
        env:
          PYTHONPATH: .
        run: pytest -v --tb=short tests/backend/services/test_ptc_readiness_service.py
