name: PTC Reproducible Research Snapshots

on:
  push:
    branches: [master]
    paths:
      - "src/backend/api/v1/ptc_snapshots.py"
      - "src/backend/api/v1/router.py"
      - "src/frontend/src/api/ptcSnapshots.ts"
      - "src/frontend/src/pages/PTCSnapshotPage.tsx"
      - "src/frontend/src/test/PTCSnapshotPage.test.tsx"
      - "src/frontend/src/App.tsx"
      - "tests/backend/api/test_ptc_snapshots.py"
      - ".github/workflows/ptc-snapshots.yml"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements-api.txt
          pip install pytest pytest-asyncio ruff aiosqlite
      - run: ruff check src/backend/api/v1/ptc_snapshots.py tests/backend/api/test_ptc_snapshots.py
      - run: pytest -v --tb=short tests/backend/api/test_ptc_snapshots.py
      - name: Verify router registration
        run: |
          python - <<'PY'
          from src.backend.api.v1.router import router
          assert any('/ptc-snapshots' in route.path for route in router.routes)
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run src/test/PTCSnapshotPage.test.tsx
      - run: npm run build
