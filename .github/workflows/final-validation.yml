name: Final Validation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Test frontend
        working-directory: src/frontend
        run: npm test
      - name: Build frontend
        working-directory: src/frontend
        run: npm run build

  migration-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cancer_db_validation
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements-api.txt
          pip install psycopg2-binary
      - name: Upgrade Alembic head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cancer_db_validation
          PYTHONPATH: .
        run: alembic -c migrations/alembic.ini upgrade head
      - name: Verify Alembic heads
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cancer_db_validation
          PYTHONPATH: .
        run: |
          alembic -c migrations/alembic.ini current
          alembic -c migrations/alembic.ini heads
