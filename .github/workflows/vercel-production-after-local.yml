name: Vercel Production After Local Verification

on:
  workflow_run:
    workflows: ["Local Verification Gate"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ai-kill-cancer-vercel-production
  cancel-in-progress: true

jobs:
  deploy-production:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.event == 'push'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    env:
      VERCEL_PROJECT_NAME: ai-kill-cancer-zqpi
      VERCEL_PRODUCTION_URL: https://ai-kill-cancer-zqpi.vercel.app
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Require Vercel token
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VERCEL_TOKEN)) { throw 'Repository secret VERCEL_TOKEN is required for gated production deployment.' }

      - name: Checkout exactly verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Reject stale verified commit
        run: |
          git fetch origin master
          $verified = '${{ github.event.workflow_run.head_sha }}'
          $latest = (git rev-parse origin/master).Trim()
          if ($verified -ne $latest) { throw "Verified SHA $verified is stale; current master is $latest. A newer Local Verification Gate must pass first." }
          Write-Host "Deploying verified master SHA: $verified"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Verify Vercel token identity
        run: |
          vercel whoami --token=$env:VERCEL_TOKEN
          vercel project ls --token=$env:VERCEL_TOKEN

      - name: Link Vercel project
        run: |
          if (Test-Path '.vercel') { Remove-Item '.vercel' -Recurse -Force }
          vercel link --yes --project=$env:VERCEL_PROJECT_NAME --token=$env:VERCEL_TOKEN

      - name: Enforce repository-root Vercel project
        run: |
          $project = Get-Content '.vercel/project.json' -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($project.projectId)) { throw 'Vercel projectId is missing after link.' }
          $headers = @{ Authorization = "Bearer $env:VERCEL_TOKEN"; 'Content-Type' = 'application/json' }
          $uri = "https://api.vercel.com/v9/projects/$($project.projectId)"
          $current = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers
          Write-Host "Current rootDirectory: $($current.rootDirectory)"
          $body = @{ rootDirectory = $null; installCommand = $null; buildCommand = $null; outputDirectory = $null; framework = $null } | ConvertTo-Json -Compress
          $updated = Invoke-RestMethod -Method Patch -Uri $uri -Headers $headers -Body $body
          Write-Host "Updated rootDirectory: $($updated.rootDirectory)"

      - name: Re-link after project correction
        run: |
          if (Test-Path '.vercel') { Remove-Item '.vercel' -Recurse -Force }
          vercel link --yes --project=$env:VERCEL_PROJECT_NAME --token=$env:VERCEL_TOKEN

      - name: Pull production environment
        run: vercel pull --yes --environment=production --token=$env:VERCEL_TOKEN

      - name: Preflight production backend environment
        run: |
          $envFile = '.vercel/.env.production.local'
          if (-not (Test-Path $envFile)) { throw 'Vercel production environment file was not pulled.' }
          $text = Get-Content $envFile -Raw
          $keys = @('APP_MODE', 'DATABASE_URL', 'DB_HOST', 'JWT_SECRET_KEY')
          foreach ($key in $keys) {
            $present = $text -match "(?m)^$([regex]::Escape($key))="
            Write-Host ("{0}: {1}" -f $key, $(if ($present) { 'PRESENT' } else { 'MISSING' }))
          }
          $productionMode = $text -match '(?m)^APP_MODE=["'']?production["'']?$'
          $hasJwt = $text -match '(?m)^JWT_SECRET_KEY='
          if ($productionMode -and -not $hasJwt) { throw 'JWT_SECRET_KEY is required because APP_MODE=production.' }

      - name: Deploy verified source to production
        id: deploy
        run: |
          $deployOutput = (& vercel deploy --prod --token=$env:VERCEL_TOKEN 2>&1 | Out-String).Trim()
          $exitCode = $LASTEXITCODE
          Write-Host $deployOutput
          if ($exitCode -ne 0) {
            if ($deployOutput -match 'api-deployments-free-per-day|Resource is limited - try again in 24 hours') {
              throw 'VERCEL_DAILY_DEPLOYMENT_QUOTA_EXHAUSTED: free-tier deployment quota reached. Do not retry by pushing no-op commits; wait for quota reset or deploy from a plan with available quota.'
            }
            throw "Vercel deployment failed with exit code $exitCode."
          }
          $url = ([regex]::Matches($deployOutput, 'https://[^\s]+\.vercel\.app') | Select-Object -Last 1).Value
          if ([string]::IsNullOrWhiteSpace($url)) { throw 'Vercel CLI completed without a deployment URL.' }
          "url=$url" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Deployment URL: $url"
          Write-Host "Canonical production URL: $env:VERCEL_PRODUCTION_URL"

      - name: Production page smoke test
        run: |
          $response = Invoke-WebRequest -Uri $env:VERCEL_PRODUCTION_URL -UseBasicParsing -TimeoutSec 30
          if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 400) { throw "Production page smoke test failed with HTTP $($response.StatusCode)" }
          Write-Host "Production page smoke test passed: HTTP $($response.StatusCode)"

      - name: Production API JSON smoke tests
        run: |
          $base = $env:VERCEL_PRODUCTION_URL.TrimEnd('/')
          $paths = @('/api/v1/health','/api/v1/ptc-readiness','/api/v1/ptc-completion/status','/api/v1/ptc-data-quality/overview','/api/v1/demo/status','/api/v1/demo/cases')
          foreach ($path in $paths) {
            $uri = "$base$path"
            try { $response = Invoke-WebRequest -Uri $uri -UseBasicParsing -TimeoutSec 60 }
            catch {
              $status = $_.Exception.Response.StatusCode.value__
              $errorBody = if ($_.ErrorDetails.Message) { [string]$_.ErrorDetails.Message } else { '' }
              if ($errorBody.Length -gt 2000) { $errorBody = $errorBody.Substring(0, 2000) }
              Write-Host "API error body for ${path}: $errorBody"
              throw "API smoke request failed for $path with HTTP $status : $($_.Exception.Message)"
            }
            $contentType = [string]$response.Headers['Content-Type']
            if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 300) { throw "API smoke failed for $path with HTTP $($response.StatusCode)" }
            if ($contentType -notmatch 'application/json|\+json') { throw "API smoke returned non-JSON for $path ($contentType)" }
            Write-Host "API smoke passed: $path -> HTTP $($response.StatusCode), $contentType"
          }

      - name: Install browser verifier
        run: |
          $verifyDir = Join-Path $env:RUNNER_TEMP 'ai-kill-cancer-browser-verify'
          if (Test-Path $verifyDir) { Remove-Item $verifyDir -Recurse -Force }
          New-Item -ItemType Directory -Path $verifyDir | Out-Null
          Push-Location $verifyDir
          npm init -y | Out-Null
          npm install playwright@1.54.2 --no-audit --no-fund
          npx playwright install chromium
          Pop-Location
          "BROWSER_VERIFY_DIR=$verifyDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Production multi-route synthetic browser verification
        run: |
          $script = @'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const base = process.env.VERCEL_PRODUCTION_URL.replace(/\/$/, '');
            const query = 'demo_case=PTC-DEMO-001&data_mode=synthetic';
            const routes = [
              { path: '/recommendation', label: 'Recommendation' },
              { path: '/clinical-decision', label: 'Clinical Decision' },
              { path: '/treatment-plans', label: 'Treatment Plan' },
              { path: '/clinical-graph', label: 'Knowledge Graph' },
              { path: '/ptc-research', label: 'PTC Research' },
              { path: '/ptc-workbench', label: 'PTC Integrated' },
              { path: '/ptc-command-center', label: 'PTC Command Center' },
            ];
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const report = { base, routes: [], failures: [] };
            const pageErrors = [];
            page.on('pageerror', err => pageErrors.push(String(err && (err.stack || err.message) || err)));
            for (const route of routes) {
              const consoleErrors = [];
              const failedRequests = [];
              const badAssets = [];
              const onConsole = msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); };
              const onFailed = req => failedRequests.push(`${req.method()} ${req.url()} :: ${req.failure()?.errorText || 'failed'}`);
              const onResponse = res => { if (res.status() >= 400 && /\.(js|css)(\?|$)/i.test(res.url())) badAssets.push(`${res.status()} ${res.url()}`); };
              page.on('console', onConsole); page.on('requestfailed', onFailed); page.on('response', onResponse);
              const url = `${base}${route.path}?${query}`;
              const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 90000 });
              await page.waitForTimeout(800);
              const bodyText = (await page.locator('body').innerText()).trim();
              const rootChildCount = await page.locator('#root').evaluate(el => el.childElementCount).catch(() => 0);
              const bannerCount = await page.locator('[data-testid="demo-context-banner"]').count();
              const current = new URL(page.url());
              const queryOK = current.searchParams.get('demo_case') === 'PTC-DEMO-001' && current.searchParams.get('data_mode') === 'synthetic';
              const meaningful = rootChildCount > 0 && bodyText.length > 80;
              const syntheticVisible = bannerCount > 0 || bodyText.includes('Synthetic') || bodyText.includes('synthetic');
              const routeResult = { label: route.label, path: route.path, status: response?.status() ?? null, queryOK, meaningful, syntheticVisible, bannerCount, consoleErrors, failedRequests, badAssets, bodyPreview: bodyText.slice(0, 500) };
              report.routes.push(routeResult);
              if (!response || response.status() >= 400 || !queryOK || !meaningful || !syntheticVisible || badAssets.length) report.failures.push(routeResult);
              await page.screenshot({ path: `route-${route.path.replace(/\//g, '_') || 'home'}.png`, fullPage: true });
              page.off('console', onConsole); page.off('requestfailed', onFailed); page.off('response', onResponse);
            }
            report.pageErrors = pageErrors;
            fs.writeFileSync('production-browser-report.json', JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
            await browser.close();
            if (report.failures.length || pageErrors.length) process.exit(1);
          })().catch(err => { console.error(err); process.exit(1); });
          '@
          $scriptPath = Join-Path $env:BROWSER_VERIFY_DIR 'verify.cjs'
          Set-Content -Path $scriptPath -Value $script -Encoding ascii
          Push-Location $env:BROWSER_VERIFY_DIR
          node $scriptPath
          Pop-Location

      - name: Upload browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-verification-${{ github.event.workflow_run.head_sha }}
          path: |
            ${{ runner.temp }}/ai-kill-cancer-browser-verify/route-*.png
            ${{ runner.temp }}/ai-kill-cancer-browser-verify/production-browser-report.json
          if-no-files-found: warn
