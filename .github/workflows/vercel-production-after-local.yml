name: Vercel Production After Local Verification

on:
  workflow_run:
    workflows: ["Local Verification Gate"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ai-kill-cancer-vercel-production
  cancel-in-progress: true

jobs:
  deploy-production:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.event == 'push'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    env:
      VERCEL_ORG_ID: team_QiaVGRjLjPmzkfZmHhEZ2IVv
      VERCEL_PROJECT_ID: prj_afBg7ytQt8XBPKA4hDOlfcrRJuMy
      VERCEL_SCOPE: cyliu99-s-projects
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Require Vercel token
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VERCEL_TOKEN)) {
            throw 'Repository secret VERCEL_TOKEN is required for gated production deployment.'
          }

      - name: Checkout exactly verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Reject stale verified commit
        run: |
          git fetch origin master
          $verified = '${{ github.event.workflow_run.head_sha }}'
          $latest = (git rev-parse origin/master).Trim()
          if ($verified -ne $latest) {
            throw "Verified SHA $verified is stale; current master is $latest. A newer Local Verification Gate must pass first."
          }
          Write-Host "Deploying verified master SHA: $verified"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Reset stale Vercel link
        run: |
          if (Test-Path '.vercel') {
            Remove-Item '.vercel' -Recurse -Force
          }

      - name: Link Vercel project
        run: vercel link --yes --project ai-kill-cancer --scope=$env:VERCEL_SCOPE --token=$env:VERCEL_TOKEN

      - name: Pull production environment
        run: vercel pull --yes --environment=production --scope=$env:VERCEL_SCOPE --token=$env:VERCEL_TOKEN

      - name: Build verified production artifact
        run: vercel build --prod --scope=$env:VERCEL_SCOPE --token=$env:VERCEL_TOKEN

      - name: Deploy prebuilt artifact to production
        id: deploy
        run: |
          $url = (vercel deploy --prebuilt --prod --scope=$env:VERCEL_SCOPE --token=$env:VERCEL_TOKEN).Trim()
          if ([string]::IsNullOrWhiteSpace($url)) {
            throw 'Vercel CLI returned an empty deployment URL.'
          }
          "url=$url" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Production URL: $url"

      - name: Production smoke test
        run: |
          $url = '${{ steps.deploy.outputs.url }}'
          $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 30
          if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 400) {
            throw "Production smoke test failed with HTTP $($response.StatusCode)"
          }
          Write-Host "Production smoke test passed: HTTP $($response.StatusCode)"
