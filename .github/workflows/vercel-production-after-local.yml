name: Vercel Production After Local Verification

on:
  workflow_run:
    workflows: ["Local Verification Gate"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ai-kill-cancer-vercel-production
  cancel-in-progress: true

jobs:
  deploy-production:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.event == 'push'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    env:
      VERCEL_PROJECT_NAME: ai-kill-cancer-zqpi
      VERCEL_PRODUCTION_URL: https://ai-kill-cancer-zqpi.vercel.app
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Require Vercel token
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VERCEL_TOKEN)) {
            throw 'Repository secret VERCEL_TOKEN is required for gated production deployment.'
          }

      - name: Checkout exactly verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Reject stale verified commit
        run: |
          git fetch origin master
          $verified = '${{ github.event.workflow_run.head_sha }}'
          $latest = (git rev-parse origin/master).Trim()
          if ($verified -ne $latest) {
            throw "Verified SHA $verified is stale; current master is $latest. A newer Local Verification Gate must pass first."
          }
          Write-Host "Deploying verified master SHA: $verified"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Verify Vercel token identity
        run: |
          vercel whoami --token=$env:VERCEL_TOKEN
          vercel project ls --token=$env:VERCEL_TOKEN

      - name: Link Vercel project
        run: |
          if (Test-Path '.vercel') {
            Remove-Item '.vercel' -Recurse -Force
          }
          vercel link --yes --project=$env:VERCEL_PROJECT_NAME --token=$env:VERCEL_TOKEN

      - name: Enforce repository-root Vercel project
        run: |
          $project = Get-Content '.vercel/project.json' -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($project.projectId)) {
            throw 'Vercel projectId is missing after link.'
          }
          $headers = @{
            Authorization = "Bearer $env:VERCEL_TOKEN"
            'Content-Type' = 'application/json'
          }
          $uri = "https://api.vercel.com/v9/projects/$($project.projectId)"
          $current = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers
          Write-Host "Current rootDirectory: $($current.rootDirectory)"
          Write-Host "Current installCommand: $($current.installCommand)"
          Write-Host "Current buildCommand: $($current.buildCommand)"
          Write-Host "Current outputDirectory: $($current.outputDirectory)"
          Write-Host "Current framework: $($current.framework)"

          $body = @{
            rootDirectory = $null
            installCommand = $null
            buildCommand = $null
            outputDirectory = $null
            framework = $null
          } | ConvertTo-Json -Compress

          $updated = Invoke-RestMethod -Method Patch -Uri $uri -Headers $headers -Body $body
          Write-Host "Updated rootDirectory: $($updated.rootDirectory)"
          Write-Host "Updated installCommand: $($updated.installCommand)"
          Write-Host "Updated buildCommand: $($updated.buildCommand)"
          Write-Host "Updated outputDirectory: $($updated.outputDirectory)"
          Write-Host "Updated framework: $($updated.framework)"

      - name: Re-link after project correction
        run: |
          if (Test-Path '.vercel') {
            Remove-Item '.vercel' -Recurse -Force
          }
          vercel link --yes --project=$env:VERCEL_PROJECT_NAME --token=$env:VERCEL_TOKEN

      - name: Pull production environment
        run: vercel pull --yes --environment=production --token=$env:VERCEL_TOKEN

      - name: Preflight production backend environment
        run: |
          $envFile = '.vercel/.env.production.local'
          if (-not (Test-Path $envFile)) {
            throw 'Vercel production environment file was not pulled.'
          }
          $text = Get-Content $envFile -Raw
          $keys = @('APP_MODE', 'DATABASE_URL', 'DB_HOST', 'JWT_SECRET_KEY')
          foreach ($key in $keys) {
            $present = $text -match "(?m)^$([regex]::Escape($key))="
            Write-Host ("{0}: {1}" -f $key, $(if ($present) { 'PRESENT' } else { 'MISSING' }))
          }
          $productionMode = $text -match '(?m)^APP_MODE=["'']?production["'']?$'
          $hasJwt = $text -match '(?m)^JWT_SECRET_KEY='
          if ($productionMode -and -not $hasJwt) {
            throw 'JWT_SECRET_KEY is required because APP_MODE=production.'
          }

      - name: Deploy verified source to production
        id: deploy
        run: |
          $url = (vercel deploy --prod --token=$env:VERCEL_TOKEN).Trim()
          if ([string]::IsNullOrWhiteSpace($url)) {
            throw 'Vercel CLI returned an empty deployment URL.'
          }
          "url=$url" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Deployment URL: $url"
          Write-Host "Canonical production URL: $env:VERCEL_PRODUCTION_URL"

      - name: Production page smoke test
        run: |
          $url = $env:VERCEL_PRODUCTION_URL
          $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 30
          if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 400) {
            throw "Production page smoke test failed with HTTP $($response.StatusCode)"
          }
          Write-Host "Production page smoke test passed: HTTP $($response.StatusCode)"

      - name: Production API JSON smoke tests
        run: |
          $base = $env:VERCEL_PRODUCTION_URL.TrimEnd('/')
          $paths = @(
            '/api/v1/health',
            '/api/v1/ptc-readiness',
            '/api/v1/ptc-completion/status',
            '/api/v1/ptc-data-quality/overview'
          )
          foreach ($path in $paths) {
            $uri = "$base$path"
            try {
              $response = Invoke-WebRequest -Uri $uri -UseBasicParsing -TimeoutSec 60
            } catch {
              $status = $_.Exception.Response.StatusCode.value__
              throw "API smoke request failed for $path with HTTP $status : $($_.Exception.Message)"
            }
            $contentType = [string]$response.Headers['Content-Type']
            if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 300) {
              throw "API smoke failed for $path with HTTP $($response.StatusCode)"
            }
            if ($contentType -notmatch 'application/json|\+json') {
              $preview = ([string]$response.Content -replace '\s+', ' ').Trim()
              if ($preview.Length -gt 180) { $preview = $preview.Substring(0, 180) }
              throw "API smoke returned non-JSON for $path ($contentType): $preview"
            }
            Write-Host "API smoke passed: $path -> HTTP $($response.StatusCode), $contentType"
          }
