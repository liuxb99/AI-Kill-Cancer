name: Phase 3H Public Data Sync Validation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  public-data-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply deterministic source integration
        run: python scripts/apply_phase3h_sync_integration.py
      - name: Commit generated integration when needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              src/backend/importers/ptc_tcga/downloader.py \
              src/backend/services/ptc_knowledge_service.py \
              src/backend/services/ptc_literature_service.py \
              src/backend/services/ptc_completion_service.py \
              src/backend/api/v1/ptc_completion.py
            git commit -m "feat(phase3h): integrate deduplicated public data downloads"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements-api.txt
          pip install pytest pytest-asyncio numpy ruff
      - name: Ruff
        run: |
          ruff check \
            src/backend/sync/public_data_store.py \
            src/backend/importers/ptc_tcga/downloader.py \
            src/backend/services/ptc_knowledge_service.py \
            src/backend/services/ptc_literature_service.py \
            src/backend/services/ptc_completion_service.py \
            src/backend/api/v1/ptc_completion.py \
            tests/test_phase3h_public_data_store.py
      - name: Phase 3H and source-adapter regressions
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          PUBLIC_DATA_DIR: "${{ runner.temp }}/public-data"
        run: |
          pytest -q \
            tests/test_phase3h_public_data_store.py \
            tests/test_ptc_tcga_downloader.py \
            tests/test_ptc_knowledge_service.py \
            tests/test_ptc_literature_service.py \
            tests/test_ptc_completion_service.py
