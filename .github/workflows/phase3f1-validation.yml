name: Phase 3F-1 Validation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  graph-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff numpy
      - name: Lint changed Python files
        run: ruff check src/backend/clinical_graph/id_factory.py tests/test_phase3f1_treatment_graph_id_contract.py
      - name: Run graph ID contract tests
        run: pytest -q tests/test_phase3f1_treatment_graph_id_contract.py
