name: PTC Deep Links and Same-Origin API

on:
  workflow_dispatch:

jobs:
  deep-link-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - name: Validate shared API client
        run: npm test -- --run src/test/apiClient.test.ts
      - name: Validate visualization API same-origin contract
        run: npm test -- --run src/test/ptcVisualizationApi.test.ts
      - name: Validate cell protein targeting literature deep links
        run: npm test -- --run src/test/PTC3DExplorerPage.test.tsx
      - name: TypeScript and production build
        run: npm run build
