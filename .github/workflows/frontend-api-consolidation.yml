name: Frontend API Consolidation

on:
  workflow_dispatch:

jobs:
  api-consolidation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - name: Enforce one shared API client
        run: npm test -- --run src/test/apiConsolidation.test.ts src/test/RecommendationPage.test.tsx
      - name: Shared client regression
        run: npm test -- --run src/test/apiClient.test.ts
      - name: TypeScript and production build
        run: npm run build
