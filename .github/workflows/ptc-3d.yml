name: PTC Multiscale 3D Explorer

on:
  push:
    branches: [master]
    paths:
      - "src/backend/api/v1/ptc_visualization.py"
      - "src/backend/api/v1/ptc_targeting.py"
      - "src/backend/api/v1/ptc_literature.py"
      - "src/backend/api/v1/ptc_assistant.py"
      - "src/backend/api/v1/ptc_reports.py"
      - "src/backend/api/v1/ptc_cohort.py"
      - "src/backend/api/v1/ptc_evidence_matrix.py"
      - "src/backend/api/v1/ptc_timeline.py"
      - "src/backend/api/v1/ptc_trial_matching.py"
      - "src/backend/services/ptc_literature_service.py"
      - "src/backend/api/v1/router.py"
      - "src/frontend/src/api/ptcVisualization.ts"
      - "src/frontend/src/api/ptcTargeting.ts"
      - "src/frontend/src/api/ptcLiterature.ts"
      - "src/frontend/src/api/ptcAssistant.ts"
      - "src/frontend/src/api/ptcReports.ts"
      - "src/frontend/src/api/ptcCohort.ts"
      - "src/frontend/src/api/ptcEvidenceMatrix.ts"
      - "src/frontend/src/api/ptcTimeline.ts"
      - "src/frontend/src/api/ptcTrialMatching.ts"
      - "src/frontend/src/components/PTCCell3D.tsx"
      - "src/frontend/src/components/PTCProtein3D.tsx"
      - "src/frontend/src/components/PTCTargetingPanel.tsx"
      - "src/frontend/src/components/PTCLiteratureAssetsPanel.tsx"
      - "src/frontend/src/components/PTCResearchAssistant.tsx"
      - "src/frontend/src/components/threeRuntime.ts"
      - "src/frontend/src/pages/PTC3DExplorerPage.tsx"
      - "src/frontend/src/pages/PTCResearchAssistantPage.tsx"
      - "src/frontend/src/pages/PTCReportCenterPage.tsx"
      - "src/frontend/src/pages/PTCCohortPage.tsx"
      - "src/frontend/src/pages/PTCEvidenceMatrixPage.tsx"
      - "src/frontend/src/pages/PTCTimelinePage.tsx"
      - "src/frontend/src/pages/PTCTrialMatchingPage.tsx"
      - "src/frontend/src/test/PTC3DExplorerPage.test.tsx"
      - "src/frontend/src/test/PTCProtein3D.test.tsx"
      - "src/frontend/src/test/PTCTargetingPanel.test.tsx"
      - "src/frontend/src/test/PTCLiteratureAssetsPanel.test.tsx"
      - "src/frontend/src/test/PTCResearchAssistant.test.tsx"
      - "src/frontend/src/test/PTCReportCenterPage.test.tsx"
      - "src/frontend/src/test/PTCCohortPage.test.tsx"
      - "src/frontend/src/test/PTCEvidenceMatrixPage.test.tsx"
      - "src/frontend/src/test/PTCTimelinePage.test.tsx"
      - "src/frontend/src/test/PTCTrialMatchingPage.test.tsx"
      - "src/frontend/src/test/ptcVisualizationApi.test.ts"
      - "src/frontend/src/App.tsx"
      - "tests/backend/api/test_ptc_visualization.py"
      - "tests/backend/api/test_ptc_targeting.py"
      - "tests/backend/api/test_ptc_assistant.py"
      - "tests/backend/api/test_ptc_reports.py"
      - "tests/backend/api/test_ptc_cohort.py"
      - "tests/backend/api/test_ptc_evidence_matrix.py"
      - "tests/backend/api/test_ptc_timeline.py"
      - "tests/backend/api/test_ptc_trial_matching.py"
      - "tests/backend/services/test_ptc_literature_assets.py"
      - ".github/workflows/ptc-3d.yml"
  workflow_dispatch:

jobs:
  backend-visualization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements-api.txt
          pip install pytest pytest-asyncio ruff aiosqlite
      - name: Lint PTC visualization and research workbench code
        run: |
          ruff check \
            src/backend/api/v1/ptc_visualization.py \
            src/backend/api/v1/ptc_targeting.py \
            src/backend/api/v1/ptc_literature.py \
            src/backend/api/v1/ptc_assistant.py \
            src/backend/api/v1/ptc_reports.py \
            src/backend/api/v1/ptc_cohort.py \
            src/backend/api/v1/ptc_evidence_matrix.py \
            src/backend/api/v1/ptc_timeline.py \
            src/backend/api/v1/ptc_trial_matching.py \
            src/backend/services/ptc_literature_service.py \
            tests/backend/api/test_ptc_visualization.py \
            tests/backend/api/test_ptc_targeting.py \
            tests/backend/api/test_ptc_assistant.py \
            tests/backend/api/test_ptc_reports.py \
            tests/backend/api/test_ptc_cohort.py \
            tests/backend/api/test_ptc_evidence_matrix.py \
            tests/backend/api/test_ptc_timeline.py \
            tests/backend/api/test_ptc_trial_matching.py \
            tests/backend/services/test_ptc_literature_assets.py
      - name: Run PTC backend research workbench tests
        run: |
          pytest -v --tb=short \
            tests/backend/api/test_ptc_visualization.py \
            tests/backend/api/test_ptc_targeting.py \
            tests/backend/api/test_ptc_assistant.py \
            tests/backend/api/test_ptc_reports.py \
            tests/backend/api/test_ptc_cohort.py \
            tests/backend/api/test_ptc_evidence_matrix.py \
            tests/backend/api/test_ptc_timeline.py \
            tests/backend/api/test_ptc_trial_matching.py \
            tests/backend/services/test_ptc_literature_assets.py
      - name: Verify API router imports
        run: |
          python - <<'PY'
          from src.backend.api.v1.router import router
          paths = {route.path for route in router.routes}
          for expected in (
              '/ptc-visualization', '/ptc-targeting', '/ptc-literature', '/ptc-assistant',
              '/ptc-reports', '/ptc-cohort', '/ptc-evidence-matrix', '/ptc-timeline',
              '/ptc-trial-matching',
          ):
              assert any(expected in path for path in paths), expected
          PY

  frontend-3d:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - name: Run PTC interaction tests
        run: |
          npm test -- --run src/test/PTC3DExplorerPage.test.tsx
          npm test -- --run src/test/PTCProtein3D.test.tsx
          npm test -- --run src/test/PTCTargetingPanel.test.tsx
          npm test -- --run src/test/PTCLiteratureAssetsPanel.test.tsx
          npm test -- --run src/test/PTCResearchAssistant.test.tsx
          npm test -- --run src/test/PTCReportCenterPage.test.tsx
          npm test -- --run src/test/PTCCohortPage.test.tsx
          npm test -- --run src/test/PTCEvidenceMatrixPage.test.tsx
          npm test -- --run src/test/PTCTimelinePage.test.tsx
          npm test -- --run src/test/PTCTrialMatchingPage.test.tsx
          npm test -- --run src/test/ptcVisualizationApi.test.ts
      - name: TypeScript and production build
        run: npm run build
