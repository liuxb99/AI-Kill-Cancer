name: PTC Multiscale 3D Explorer

on:
  push:
    branches: [master]
    paths:
      - "src/backend/api/v1/ptc_visualization.py"
      - "src/backend/api/v1/router.py"
      - "src/frontend/src/api/ptcVisualization.ts"
      - "src/frontend/src/components/PTCCell3D.tsx"
      - "src/frontend/src/components/PTCProtein3D.tsx"
      - "src/frontend/src/components/threeRuntime.ts"
      - "src/frontend/src/pages/PTC3DExplorerPage.tsx"
      - "src/frontend/src/test/PTC3DExplorerPage.test.tsx"
      - "src/frontend/src/test/PTCProtein3D.test.tsx"
      - "src/frontend/src/App.tsx"
      - "tests/backend/api/test_ptc_visualization.py"
      - ".github/workflows/ptc-3d.yml"
  workflow_dispatch:

jobs:
  backend-visualization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements-api.txt
          pip install pytest pytest-asyncio ruff aiosqlite
      - name: Lint visualization API and tests
        run: |
          ruff check src/backend/api/v1/ptc_visualization.py tests/backend/api/test_ptc_visualization.py
      - name: Run visualization API tests
        run: pytest -v --tb=short tests/backend/api/test_ptc_visualization.py
      - name: Verify API router import
        run: python -c "from src.backend.api.v1.router import router; assert any('/ptc-visualization' in route.path for route in router.routes)"

  frontend-3d:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - name: Run 3D explorer interaction tests
        run: |
          npm test -- --run src/test/PTC3DExplorerPage.test.tsx
          npm test -- --run src/test/PTCProtein3D.test.tsx
      - name: TypeScript and production build
        run: npm run build
