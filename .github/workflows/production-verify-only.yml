name: Production Verification Only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-kill-cancer-production-verify-only
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    env:
      VERCEL_PRODUCTION_URL: https://ai-kill-cancer-zqpi.vercel.app

    steps:
      - name: Checkout current master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Record verification target
        run: |
          $sha = (git rev-parse HEAD).Trim()
          Write-Host "Verification source SHA: $sha"
          Write-Host "Canonical production URL: $env:VERCEL_PRODUCTION_URL"
          "VERIFICATION_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Production page smoke test
        run: |
          $response = Invoke-WebRequest -Uri $env:VERCEL_PRODUCTION_URL -UseBasicParsing -TimeoutSec 30
          if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 400) {
            throw "Production page smoke test failed with HTTP $($response.StatusCode)"
          }
          Write-Host "Production page smoke test passed: HTTP $($response.StatusCode)"

      - name: Production API JSON smoke tests
        run: |
          $base = $env:VERCEL_PRODUCTION_URL.TrimEnd('/')
          $paths = @(
            '/api/v1/health',
            '/api/v1/ptc-readiness',
            '/api/v1/ptc-completion/status',
            '/api/v1/ptc-data-quality/overview',
            '/api/v1/demo/status',
            '/api/v1/demo/cases'
          )
          foreach ($path in $paths) {
            $uri = "$base$path"
            try {
              $response = Invoke-WebRequest -Uri $uri -UseBasicParsing -TimeoutSec 60
            } catch {
              $status = $_.Exception.Response.StatusCode.value__
              $errorBody = if ($_.ErrorDetails.Message) { [string]$_.ErrorDetails.Message } else { '' }
              if ($errorBody.Length -gt 2000) { $errorBody = $errorBody.Substring(0, 2000) }
              Write-Host "API error body for ${path}: $errorBody"
              throw "API smoke request failed for $path with HTTP $status : $($_.Exception.Message)"
            }
            $contentType = [string]$response.Headers['Content-Type']
            if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 300) {
              throw "API smoke failed for $path with HTTP $($response.StatusCode)"
            }
            if ($contentType -notmatch 'application/json|\+json') {
              throw "API smoke returned non-JSON for $path ($contentType)"
            }
            Write-Host "API smoke passed: $path -> HTTP $($response.StatusCode), $contentType"
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser verifier
        run: |
          $verifyDir = Join-Path $env:RUNNER_TEMP 'ai-kill-cancer-production-verify-only'
          if (Test-Path $verifyDir) { Remove-Item $verifyDir -Recurse -Force }
          New-Item -ItemType Directory -Path $verifyDir | Out-Null
          Push-Location $verifyDir
          npm init -y | Out-Null
          npm install playwright@1.54.2 --no-audit --no-fund
          npx playwright install chromium
          Pop-Location
          "BROWSER_VERIFY_DIR=$verifyDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Production multi-route synthetic browser verification
        run: |
          $script = @'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const base = process.env.VERCEL_PRODUCTION_URL.replace(/\/$/, '');
            const query = 'demo_case=PTC-DEMO-001&data_mode=synthetic';
            const routes = [
              { path: '/recommendation', label: 'Recommendation' },
              { path: '/clinical-decision', label: 'Clinical Decision' },
              { path: '/treatment-plans', label: 'Treatment Plan' },
              { path: '/clinical-graph', label: 'Knowledge Graph' },
              { path: '/ptc-research', label: 'PTC Research' },
              { path: '/ptc-workbench', label: 'PTC Integrated' },
              { path: '/ptc-command-center', label: 'PTC Command Center' },
            ];

            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const report = {
              base,
              verificationSha: process.env.VERIFICATION_SHA || null,
              routes: [],
              failures: [],
              pageErrors: [],
            };

            page.on('pageerror', err => report.pageErrors.push(String(err && (err.stack || err.message) || err)));

            for (const route of routes) {
              const badAssets = [];
              const onResponse = res => {
                if (res.status() >= 400 && /\.(js|css)(\?|$)/i.test(res.url())) {
                  badAssets.push(`${res.status()} ${res.url()}`);
                }
              };
              page.on('response', onResponse);

              const url = `${base}${route.path}?${query}`;
              const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 90000 });
              await page.waitForTimeout(800);

              const bodyText = (await page.locator('body').innerText()).trim();
              const rootChildCount = await page.locator('#root').evaluate(el => el.childElementCount).catch(() => 0);
              const bannerCount = await page.locator('[data-testid="demo-context-banner"]').count();
              const current = new URL(page.url());
              const queryOK = current.searchParams.get('demo_case') === 'PTC-DEMO-001' && current.searchParams.get('data_mode') === 'synthetic';
              const meaningful = rootChildCount > 0 && bodyText.length > 80;
              const syntheticVisible = bannerCount > 0 || bodyText.includes('Synthetic') || bodyText.includes('synthetic');

              const routeResult = {
                label: route.label,
                path: route.path,
                status: response?.status() ?? null,
                queryOK,
                meaningful,
                syntheticVisible,
                bannerCount,
                badAssets,
                bodyPreview: bodyText.slice(0, 500),
              };
              report.routes.push(routeResult);
              if (!response || response.status() >= 400 || !queryOK || !meaningful || !syntheticVisible || badAssets.length) {
                report.failures.push(routeResult);
              }

              await page.screenshot({ path: `route-${route.path.replace(/\//g, '_') || 'home'}.png`, fullPage: true });
              page.off('response', onResponse);
            }

            fs.writeFileSync('production-browser-report.json', JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
            await browser.close();
            if (report.failures.length || report.pageErrors.length) process.exit(1);
          })().catch(err => { console.error(err); process.exit(1); });
          '@
          $scriptPath = Join-Path $env:BROWSER_VERIFY_DIR 'verify.cjs'
          Set-Content -Path $scriptPath -Value $script -Encoding ascii
          Push-Location $env:BROWSER_VERIFY_DIR
          node $scriptPath
          Pop-Location

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-verify-only-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ai-kill-cancer-production-verify-only/route-*.png
            ${{ runner.temp }}/ai-kill-cancer-production-verify-only/production-browser-report.json
          if-no-files-found: warn
