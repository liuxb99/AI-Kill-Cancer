name: Dual-Mode Database UI

on:
  workflow_dispatch:

jobs:
  dual-mode-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - name: Run dual-mode interaction tests
        run: |
          npm test -- --run src/test/DualModeSelector.test.tsx
          npm test -- --run src/test/PTCKnowledgeSelectionPage.test.tsx
          npm test -- --run src/test/PTCIntegratedSelectionPage.test.tsx
          npm test -- --run src/test/PTCResearchAssistant.test.tsx
          npm test -- --run src/test/PTCReportCenterPage.test.tsx
          npm test -- --run src/test/PTCDataQualityPage.test.tsx
          npm test -- --run src/test/LegacyDualModePages.test.tsx
      - name: TypeScript and production build
        run: npm run build
