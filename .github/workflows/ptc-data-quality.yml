name: PTC Data Provenance and Freshness

on:
  push:
    branches: [master]
    paths:
      - "src/backend/api/v1/ptc_data_quality.py"
      - "src/backend/api/v1/router.py"
      - "src/frontend/src/api/ptcDataQuality.ts"
      - "src/frontend/src/pages/PTCDataQualityPage.tsx"
      - "src/frontend/src/test/PTCDataQualityPage.test.tsx"
      - "src/frontend/src/App.tsx"
      - "tests/backend/api/test_ptc_data_quality.py"
      - ".github/workflows/ptc-data-quality.yml"
  workflow_dispatch:

jobs:
  backend-quality-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements-api.txt
          pip install pytest pytest-asyncio ruff aiosqlite
      - name: Lint audit code
        run: |
          ruff check src/backend/api/v1/ptc_data_quality.py tests/backend/api/test_ptc_data_quality.py
      - name: Run provenance and freshness tests
        run: pytest -v --tb=short tests/backend/api/test_ptc_data_quality.py
      - name: Verify API registration
        run: |
          python - <<'PY'
          from src.backend.api.v1.router import router
          paths = {route.path for route in router.routes}
          assert any('/ptc-data-quality' in path for path in paths)
          PY

  frontend-quality-center:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - name: Run data quality interactions
        run: npm test -- --run src/test/PTCDataQualityPage.test.tsx
      - name: TypeScript and production build
        run: npm run build
