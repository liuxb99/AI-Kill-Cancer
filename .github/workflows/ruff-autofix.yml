name: Ruff Auto-fix

on:
  push:
    branches: [master, main]

permissions:
  contents: write

concurrency:
  group: ruff-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: python -m pip install --upgrade ruff

      - name: Apply Ruff fixes
        run: ruff check src/ tests/ --fix

      - name: Commit deterministic formatting fixes
        run: |
          if git diff --quiet; then
            echo 'No Ruff fixes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'style: apply Ruff import ordering fixes'
          git push
