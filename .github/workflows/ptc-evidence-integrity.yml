name: PTC Evidence Matrix Integrity

on:
  push:
    branches: [master]
    paths:
      - "src/backend/api/v1/ptc_evidence_matrix.py"
      - "src/frontend/src/api/ptcEvidenceMatrix.ts"
      - "src/frontend/src/pages/PTCEvidenceMatrixPage.tsx"
      - "src/frontend/src/components/DualModeSelector.tsx"
      - "src/frontend/src/test/PTCEvidenceMatrixPage.test.tsx"
      - "tests/backend/api/test_ptc_evidence_matrix.py"
      - ".github/workflows/ptc-evidence-integrity.yml"
  workflow_dispatch:

jobs:
  backend-scientific-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements-api.txt
          pip install pytest pytest-asyncio ruff aiosqlite
      - name: Lint evidence matrix
        run: ruff check src/backend/api/v1/ptc_evidence_matrix.py tests/backend/api/test_ptc_evidence_matrix.py
      - name: Test outcome-blind evidence scoring
        run: pytest -v --tb=short tests/backend/api/test_ptc_evidence_matrix.py
      - name: Static outcome leakage guard
        run: |
          python - <<'PY'
          from src.backend.api.v1.ptc_evidence_matrix import (
              OUTCOME_FIELDS_EXCLUDED,
              SCORE_WEIGHTS,
          )
          assert sum(SCORE_WEIGHTS.values()) == 100.0
          assert "same_gene_cohort" not in SCORE_WEIGHTS
          assert "vital_status" not in SCORE_WEIGHTS
          assert set(OUTCOME_FIELDS_EXCLUDED) == {
              "vital_status",
              "days_to_last_follow_up",
              "days_to_death",
              "outcomes",
          }
          PY

  frontend-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - name: Evidence matrix UI contract
        run: npm test -- --run src/test/PTCEvidenceMatrixPage.test.tsx
      - name: Shared client regression
        run: npm test -- --run src/test/apiClient.test.ts
      - name: TypeScript and production build
        run: npm run build
