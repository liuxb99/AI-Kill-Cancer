name: CI

on:
  push:
    branches: [master, main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cancer_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements-api.txt
          pip install pytest pytest-cov ruff mypy numpy httpx pytest-asyncio anyio

      # Phase 2: Lint with ruff (covers src/ and tests/ including new Phase 2 files)
      - name: Lint with ruff
        run: ruff check src/ tests/

      # TODO: Re-enable mypy when type annotations are complete across the codebase.
      # Current approach: mypy src/ --ignore-missing-imports
      # Blocked on: missing type annotations in models/, repositories/, and domain/

      # Phase 2: Run all tests (unit + integration)
      - name: Test with pytest
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cancer_db
        run: pytest -v --tb=short --cov=src/backend --ignore=tests/integration/test_migration_016.py tests/unit/ tests/integration/

      # Phase 2: Postgres Integration Gate
      - name: Postgres Integration Gate - Alembic upgrade on Postgres
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cancer_db
          PYTHONPATH: .
        run: alembic -c migrations/alembic.ini upgrade head

      - name: Postgres Integration Gate - Run Tests on Postgres
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cancer_db
        shell: bash
        run: |
          python3 << 'PYEOF'
          import subprocess, sys

          tests_groups = [
              ("Restart Recovery", ["tests/test_restart_recovery.py"]),
              ("Trace Persistence", ["tests/test_trace_persistence.py", "tests/test_acceptance_real_trace.py"]),
              ("Other Backend", ["tests/test_recommendation_transaction.py", "tests/test_api_recommendation.py", "tests/test_recommendation_service.py"]),
          ]

          exit_code = 0
          for name, test_files in tests_groups:
              print(f"\n::group::=== {name} Tests on Postgres ===")
              sys.stdout.flush()
              result = subprocess.run(
                  ["pytest", "-v", "--tb=long"] + test_files,
                  capture_output=True, text=True, timeout=120
              )
              print(result.stdout)
              if result.stderr:
                  print(result.stderr)
              print("::endgroup::")
              sys.stdout.flush()
              if result.returncode != 0:
                  exit_code = result.returncode
                  # Emit annotations for failed tests
                  for line in result.stdout.split('\n'):
                      stripped = line.strip()
                      if stripped.startswith('FAILED ') or stripped.startswith('ERROR '):
                          print(f"::error title={name} Failed::{stripped}")
                  # Extract traceback context
                  fail_lines = []
                  capture = False
                  for line in result.stdout.split('\n'):
                      if line.startswith('FAILED ') or line.startswith('ERROR '):
                          capture = True
                          fail_lines = []
                      elif line.startswith('tests/') and '::' in line and 'PASSED' in line:
                          capture = False
                      elif capture and line.strip():
                          fail_lines.append(line.strip())
                  if fail_lines:
                      tb_text = ' | '.join(fail_lines[-8:])
                      if len(tb_text) > 500:
                          tb_text = tb_text[:500] + '...'
                      print(f"::error title={name} Traceback::{tb_text}")
                  sys.stdout.flush()

          sys.exit(exit_code)
          PYEOF

      - name: Postgres Integration Gate - Alembic downgrade & re-upgrade
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cancer_db
          PYTHONPATH: .
        run: |
          alembic -c migrations/alembic.ini downgrade 016
          alembic -c migrations/alembic.ini upgrade head

      - name: Postgres Integration Gate - Migration verification
        env:
          DATABASE_URL: sqlite+aiosqlite:///test_migration_ci.db
          PYTHONPATH: .
        run: pytest -v --tb=short tests/test_migration.py

      # Phase 2: Test migration (database schema)
      - name: Test migration
        env:
          DATABASE_URL: sqlite+aiosqlite:///test_migration_ci.db
          PYTHONPATH: .
        run: |
          rm -f test_migration_ci.db test_migration_ci.db-wal test_migration_ci.db-shm
          alembic -c migrations/alembic.ini upgrade head

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm cache clean --force
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci attempt $i failed, retrying in 5s..."
            sleep 5
          done
        working-directory: src/frontend

      # Phase 2: Run frontend tests (covers src/test/tabs/)
      - name: Test frontend
        run: npm test
        working-directory: src/frontend

      - name: Build frontend
        run: npm run build
        working-directory: src/frontend

