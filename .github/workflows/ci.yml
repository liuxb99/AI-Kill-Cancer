name: CI

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cancer_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements-api.txt
          pip install pytest pytest-cov ruff mypy numpy httpx pytest-asyncio anyio psycopg2-binary

      # Phase 2: Lint with ruff (covers src/ and tests/ including new Phase 2 files)
      - name: Lint with ruff
        run: ruff check src/ tests/

      # TODO: Re-enable mypy when type annotations are complete across the codebase.
      # Current approach: mypy src/ --ignore-missing-imports
      # Blocked on: missing type annotations in models/, repositories/, and domain/

      # Phase 3D: Run Phase 3D Outbox tests
      - name: Phase 3D Outbox Tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: pytest -v --tb=short tests/unit/test_phase3d_*.py

      # Phase 3D: KnowGraphGo Integration
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # Phase 2: Run all tests (unit + integration)
      - name: Test with pytest
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cancer_db
        run: pytest -v --tb=short --cov=src/backend --ignore=tests/integration/test_migration_016.py --ignore=tests/integration/test_migration_025_pg_trace_constraint.py --ignore=tests/integration/test_migration_025_pg_schema_compare.py --ignore=tests/integration/test_migration_025_pg_full_cycle.py tests/unit/ tests/integration/

      # ============================================================
      # CI-01: Cross-language ID Parity
      # ============================================================
      - name: CI-01 Checkout KnowGraphGo (fixed SHA)
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          rm -rf KnowGraphGo
          git init KnowGraphGo
          cd KnowGraphGo
          git remote add origin https://x-access-token:${{ secrets.PAT }}@github.com/liuxb99/KnowGraphGo.git
          git fetch --depth=1 origin 189d41526d72714d173f5cd5a62a5f104e377921
          git checkout 189d41526d72714d173f5cd5a62a5f104e377921

      - name: CI-01 Build Go CLI
        working-directory: KnowGraphGo
        run: go build -o knowgraph.exe ./cmd/knowgraph/

      - name: CI-01 Run Go golden test
        working-directory: KnowGraphGo
        run: go test ./adapter/... -run TestGoldenIDOutput -v

      - name: CI-01 Run Python ID parity test
        run: python -m pytest tests/test_phase3d_id_parity.py -v --tb=short

      # ============================================================
      # CI-02: Cross-repository E2E Digital Thread
      # ============================================================
      - name: CI-02 Cross-repository E2E Digital Thread
        env:
          KNOWGRAPH_CLI: KnowGraphGo/knowgraph.exe
        run: python scripts/cross_repo_e2e_test.py

      # ============================================================
      # CI-03~CI-05: Go adapter tests (Stub + Provenance + No Panic)
      # ============================================================
      - name: CI-03~CI-05 Go adapter tests
        working-directory: KnowGraphGo
        run: go test ./adapter/... -v

      # Phase 2: Postgres Integration Gate
      - name: Postgres Integration Gate - Alembic upgrade on Postgres
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cancer_db
          PYTHONPATH: .
        run: alembic -c migrations/alembic.ini upgrade head

      - name: Postgres Integration Gate - Run Tests on Postgres
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cancer_db
        run: |
          EXIT=0
          echo "=== Restart Recovery Test on Postgres ==="
          pytest -v --tb=long tests/test_restart_recovery.py 2>&1 | tee /tmp/pg-test-restart.log; rc=${PIPESTATUS[0]}; [ $rc -ne 0 ] && EXIT=$rc
          echo "=== Trace Persistence Tests ==="
          pytest -v --tb=long tests/test_trace_persistence.py tests/test_acceptance_real_trace.py 2>&1 | tee /tmp/pg-test-trace.log; rc=${PIPESTATUS[0]}; [ $rc -ne 0 ] && EXIT=$rc
          echo "=== Other Backend Tests ==="
          pytest -v --tb=long tests/test_recommendation_transaction.py tests/test_api_recommendation.py tests/test_recommendation_service.py 2>&1 | tee /tmp/pg-test-other.log; rc=${PIPESTATUS[0]}; [ $rc -ne 0 ] && EXIT=$rc
          echo "=== Phase 3C: Tumor Board Tests ==="
          pytest -v --tb=long tests/test_tumor_board_engine.py tests/test_tumor_board_models.py tests/test_tumor_board_repo.py tests/test_tumor_board_service.py tests/test_api_tumor_board.py tests/test_tumor_board_digital_thread.py tests/test_tumor_board_restart_recovery.py 2>&1 | tee /tmp/pg-test-tumor-board.log; rc=${PIPESTATUS[0]}; [ $rc -ne 0 ] && EXIT=$rc
          echo "=== Phase 3E: Treatment Plan Tests ==="
          pytest -v --tb=long tests/backend/integration/test_treatment_plan_restart.py tests/backend/integration/test_treatment_plan_digital_thread.py tests/backend/services/test_treatment_plan_service.py tests/backend/repositories/test_treatment_plan_repos.py tests/backend/api/test_treatment_plan_api.py tests/backend/models/test_treatment_plan_models.py tests/backend/clinical/test_treatment_plan_engine.py 2>&1 | tee /tmp/pg-test-phase3e.log; rc=${PIPESTATUS[0]}; [ $rc -ne 0 ] && EXIT=$rc
          # Emit annotations for any failures found in logs
          bash scripts/emit_annotations.sh 2>&1 || true
          exit $EXIT

      - name: Postgres Integration Gate - Alembic downgrade & re-upgrade
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cancer_db
          PYTHONPATH: .
        run: |
          # Insert test data to verify 020→019 downgrade is blocked when data exists
          python -c "
          import asyncio, os
          from sqlalchemy.ext.asyncio import create_async_engine
          from sqlalchemy import text, Integer
          async def main():
              engine = create_async_engine(os.environ['DATABASE_URL'])
              async with engine.connect() as conn:
                  # First create a patient to satisfy FK constraint (Postgres)
                  await conn.execute(text(\"INSERT INTO domain_patients (id, display_name, sex, consent_status) VALUES ('ci-test-pid', 'CI Test Patient', 'F', 'granted')\"))
                  await conn.execute(text(\"INSERT INTO domain_tumor_board_consensus (id, consensus_id, patient_id, consensus_status) VALUES ('ci-test-id', 'ci-test-cid', 'ci-test-pid', 'pending')\"))
                  await conn.commit()
              await engine.dispose()
          asyncio.run(main())
          "
          # Verify downgrade is blocked when data exists
          alembic -c migrations/alembic.ini downgrade 019 2>&1 && { echo "ERROR: 020→019 downgrade should have been blocked when data exists"; exit 1; } || echo "OK: 020→019 downgrade blocked as expected (data exists)"
          # Delete test data so empty-table downgrade can proceed
          python -c "
          import asyncio, os
          from sqlalchemy.ext.asyncio import create_async_engine
          from sqlalchemy import text
          async def main():
              engine = create_async_engine(os.environ['DATABASE_URL'])
              async with engine.connect() as conn:
                  await conn.execute(text(\"DELETE FROM domain_tumor_board_opinions\"))
                  await conn.execute(text(\"DELETE FROM domain_tumor_board_consensus_traces\"))
                  await conn.execute(text(\"DELETE FROM domain_tumor_board_consensus\"))
                  await conn.execute(text(\"DELETE FROM domain_patients WHERE id = 'ci-test-pid'\"))
                  await conn.commit()
              await engine.dispose()
          asyncio.run(main())
          "
          # Now downgrade should succeed (empty tables)
          alembic -c migrations/alembic.ini downgrade 019
          # Full downgrade to 016 and re-upgrade
          alembic -c migrations/alembic.ini downgrade 016
          alembic -c migrations/alembic.ini upgrade head

      - name: Postgres Integration Gate - Migration 023 Downgrade / Re-upgrade
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cancer_db
          PYTHONPATH: .
        run: |
          alembic -c migrations/alembic.ini downgrade 022
          alembic -c migrations/alembic.ini upgrade 023
          alembic -c migrations/alembic.ini upgrade head

      - name: Postgres Integration Gate - Migration verification
        env:
          DATABASE_URL: sqlite+aiosqlite:///test_migration_ci.db
          PYTHONPATH: .
        run: pytest -v --tb=short tests/test_migration.py

      # Phase 2: Test migration (database schema)
      - name: Test migration
        env:
          DATABASE_URL: sqlite+aiosqlite:///test_migration_ci.db
          PYTHONPATH: .
        run: |
          rm -f test_migration_ci.db test_migration_ci.db-wal test_migration_ci.db-shm
          alembic -c migrations/alembic.ini upgrade head


  # ============================================================
  # A-04/A-05: Migration Gate (isolated PostgreSQL)
  # ============================================================
  migration-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cancer_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements-api.txt
          pip install pytest pytest-cov ruff mypy numpy httpx pytest-asyncio anyio psycopg2-binary

      - name: Create isolated database
        env:
          PGPASSWORD: postgres
        run: createdb -h localhost -U postgres cancer_db_migration_gate

      - name: Upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cancer_db_migration_gate
          PYTHONPATH: .
        run: alembic -c migrations/alembic.ini upgrade head

      - name: Migration verify
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cancer_db_migration_gate
          PYTHONPATH: .
        run: alembic -c migrations/alembic.ini check

      - name: Migration schema validation (PostgreSQL)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cancer_db_migration_gate
        run: |
          python -c "
          import asyncio, os
          from sqlalchemy.ext.asyncio import create_async_engine
          from sqlalchemy import text
          async def main():
              engine = create_async_engine(os.environ['DATABASE_URL'])
              async with engine.connect() as conn:
                  # Verify domain_treatment_plans composite unique constraint
                  result = await conn.execute(text(\"\"\"
                      SELECT con.conname FROM pg_catalog.pg_constraint con
                      JOIN pg_catalog.pg_class rel ON rel.oid = con.conrelid
                      WHERE rel.relname = 'domain_treatment_plans'
                        AND con.contype = 'u'
                  \"\"\"))
                  rows = [r[0] for r in result.fetchall()]
                  print('domain_treatment_plans unique constraints:', rows)
                  assert 'uq_plan_id_version' in rows, 'Missing uq_plan_id_version'
                  # Verify domain_treatment_plan_traces composite unique constraint
                  result = await conn.execute(text(\"\"\"
                      SELECT con.conname FROM pg_catalog.pg_constraint con
                      JOIN pg_catalog.pg_class rel ON rel.oid = con.conrelid
                      WHERE rel.relname = 'domain_treatment_plan_traces'
                        AND con.contype = 'u'
                  \"\"\"))
                  rows = [r[0] for r in result.fetchall()]
                  print('domain_treatment_plan_traces unique constraints:', rows)
                  assert 'uq_trace_step' in rows, 'Missing uq_trace_step'
                  # Verify foreign keys exist
                  result = await conn.execute(text(\"\"\"
                      SELECT con.conname FROM pg_catalog.pg_constraint con
                      JOIN pg_catalog.pg_class rel ON rel.oid = con.conrelid
                      WHERE rel.relname = 'domain_treatment_plans'
                        AND con.contype = 'f'
                  \"\"\"))
                  fk_rows = [r[0] for r in result.fetchall()]
                  print('domain_treatment_plans foreign keys:', fk_rows)
                  assert 'fk_prev_version' in fk_rows, 'Missing fk_prev_version'
                  assert 'fk_supersedes_version' in fk_rows, 'Missing fk_supersedes_version'
                  print('All PostgreSQL schema validations passed!')
              await engine.dispose()
          asyncio.run(main())
          "

      - name: Run Migration Gate tests (pytest)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cancer_db_migration_gate
          PYTHONPATH: .
        run: |
          pytest -v --tb=long tests/test_migration_gate.py
          pytest -v --tb=long tests/integration/test_migration_025_pg_trace_constraint.py
          pytest -v --tb=long tests/integration/test_migration_025_pg_schema_compare.py
          pytest -v --tb=long tests/integration/test_migration_025_pg_full_cycle.py

      - name: Downgrade 024
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cancer_db_migration_gate
          PYTHONPATH: .
        run: alembic -c migrations/alembic.ini downgrade 024

      - name: Re-upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cancer_db_migration_gate
          PYTHONPATH: .
        run: alembic -c migrations/alembic.ini upgrade head

      - name: Final verify
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cancer_db_migration_gate
          PYTHONPATH: .
        run: alembic -c migrations/alembic.ini check

      - name: Drop migration gate database
        if: always()
        env:
          PGPASSWORD: postgres
        run: dropdb -h localhost -U postgres cancer_db_migration_gate

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm cache clean --force
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci attempt $i failed, retrying in 5s..."
            sleep 5
          done
        working-directory: src/frontend

      # Phase 2: Run frontend tests (covers src/test/tabs/)
      - name: Test frontend
        run: npm test
        working-directory: src/frontend

      - name: Build frontend
        run: npm run build
        working-directory: src/frontend
