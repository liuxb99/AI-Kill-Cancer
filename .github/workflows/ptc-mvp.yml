name: PTC MVP Pipeline

on:
  push:
    branches: [master]
    paths:
      - "src/backend/domain/ptc_research.py"
      - "src/backend/importers/ptc_tcga/**"
      - "src/backend/api/v1/ptc_research.py"
      - "src/backend/api/v1/router.py"
      - "src/frontend/src/api/ptcResearch.ts"
      - "src/frontend/src/pages/PTCResearchPage.tsx"
      - "src/frontend/src/App.tsx"
      - "migrations/versions/026_ptc_research_data_foundation.py"
      - "scripts/ptc_cross_repo_e2e.py"
      - "tests/backend/importers/**"
      - ".github/workflows/ptc-mvp.yml"
  workflow_dispatch:

jobs:
  ptc-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ptc_mvp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements-api.txt
          pip install pytest pytest-asyncio ruff aiosqlite asyncpg psycopg2-binary
      - name: Lint PTC production and tests
        run: |
          ruff check \
            src/backend/domain/ptc_research.py \
            src/backend/importers/ptc_tcga/ \
            src/backend/api/v1/ptc_research.py \
            scripts/import_ptc_tcga.py \
            scripts/ptc_cross_repo_e2e.py \
            tests/backend/importers/
      - name: Upgrade PostgreSQL through migration 026
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ptc_mvp
          PYTHONPATH: .
        run: alembic -c migrations/alembic.ini upgrade head
      - name: Run PTC importer tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ptc_mvp
        run: pytest -v --tb=short tests/backend/importers/
      - name: Verify migration 026 tables and constraints
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ptc_mvp
        run: |
          python - <<'PY'
          import asyncio, os
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          async def main():
              engine = create_async_engine(os.environ["DATABASE_URL"])
              async with engine.connect() as conn:
                  rows = await conn.execute(text("""
                      SELECT table_name FROM information_schema.tables
                      WHERE table_schema='public' AND table_name LIKE 'domain_ptc_%'
                      ORDER BY table_name
                  """))
                  names = {row[0] for row in rows}
                  expected = {
                      'domain_ptc_research_cases', 'domain_ptc_variants',
                      'domain_ptc_outcomes', 'domain_ptc_import_batches',
                  }
                  assert names == expected, (names, expected)
              await engine.dispose()
          asyncio.run(main())
          PY

  ptc-graph-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements-api.txt
          pip install pytest pytest-asyncio aiosqlite
      - name: Checkout KnowGraphGo PTC projection
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          git clone https://x-access-token:${PAT}@github.com/liuxb99/KnowGraphGo.git KnowGraphGo
          cd KnowGraphGo
          git checkout 96c569bae1d4bb02c05d8557ec2ee0a5a0a28b63
      - name: Build and test KnowGraphGo PTC adapter
        working-directory: KnowGraphGo
        run: |
          go test ./adapter/ptc/... -v
          go build ./cmd/ptcgraph
          go build ./cmd/knowgraph
      - name: Run cross-repository PTC E2E and replay
        run: python scripts/ptc_cross_repo_e2e.py --knowgraph-repo KnowGraphGo

  ptc-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
