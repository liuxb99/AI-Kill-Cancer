name: PTC MVP Pipeline

on:
  push:
    branches: [master]
    paths:
      - "src/backend/domain/ptc_*.py"
      - "src/backend/importers/ptc_tcga/**"
      - "src/backend/services/ptc_*_service.py"
      - "src/backend/api/v1/ptc_*.py"
      - "src/backend/api/v1/router.py"
      - "src/frontend/src/api/ptc*.ts"
      - "src/frontend/src/pages/PTC*.tsx"
      - "src/frontend/src/App.tsx"
      - "migrations/versions/026_*.py"
      - "migrations/versions/027_*.py"
      - "migrations/versions/028_*.py"
      - "scripts/ptc_*.py"
      - "tests/backend/importers/**"
      - "tests/backend/services/test_ptc_*.py"
      - ".github/workflows/ptc-mvp.yml"
  workflow_dispatch:

jobs:
  ptc-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ptc_mvp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements-api.txt
          pip install pytest pytest-asyncio ruff aiosqlite asyncpg psycopg2-binary
      - name: Lint PTC production and tests
        run: |
          ruff check --ignore F401 \
            src/backend/domain/ptc_research.py \
            src/backend/domain/ptc_knowledge.py \
            src/backend/domain/ptc_integrated.py \
            src/backend/importers/ptc_tcga/ \
            src/backend/services/ptc_knowledge_service.py \
            src/backend/services/ptc_integrated_service.py \
            src/backend/api/v1/ptc_research.py \
            src/backend/api/v1/ptc_knowledge.py \
            src/backend/api/v1/ptc_integrated.py \
            scripts/import_ptc_tcga.py \
            scripts/ptc_cross_repo_e2e.py \
            tests/backend/importers/ \
            tests/backend/services/test_ptc_knowledge_service.py \
            tests/backend/services/test_ptc_integrated_service.py
      - name: Upgrade PostgreSQL through migration 028
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ptc_mvp
          PYTHONPATH: .
        run: alembic -c migrations/alembic.ini upgrade head
      - name: Run PTC tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ptc_mvp
        run: pytest -v --tb=short tests/backend/importers/ tests/backend/services/test_ptc_knowledge_service.py tests/backend/services/test_ptc_integrated_service.py
      - name: Verify PTC tables
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ptc_mvp
        run: |
          python - <<'PY'
          import asyncio, os
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          async def main():
              engine = create_async_engine(os.environ["DATABASE_URL"])
              async with engine.connect() as conn:
                  rows = await conn.execute(text("""
                      SELECT table_name FROM information_schema.tables
                      WHERE table_schema='public' AND table_name LIKE 'domain_ptc_%'
                  """))
                  names = {row[0] for row in rows}
                  expected = {
                      'domain_ptc_research_cases', 'domain_ptc_variants',
                      'domain_ptc_outcomes', 'domain_ptc_import_batches',
                      'domain_ptc_therapies', 'domain_ptc_therapy_targets',
                      'domain_ptc_clinical_trials', 'domain_ptc_evidence_records',
                      'domain_ptc_herbs', 'domain_ptc_herb_compounds',
                      'domain_ptc_herb_drug_interactions', 'domain_ptc_case_similarities',
                      'domain_ptc_recommendation_snapshots',
                  }
                  assert expected.issubset(names), (names, expected)
                  target_genes = await conn.execute(text("""
                      SELECT column_name FROM information_schema.columns
                      WHERE table_name='domain_ptc_clinical_trials' AND column_name='target_genes'
                  """))
                  assert target_genes.first() is not None
              await engine.dispose()
          asyncio.run(main())
          PY

  ptc-graph-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements-api.txt
          pip install pytest pytest-asyncio aiosqlite
      - name: Checkout KnowGraphGo PTC projection
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/liuxb99/KnowGraphGo.git KnowGraphGo
          cd KnowGraphGo
          git checkout 96c569bae1d4bb02c05d8557ec2ee0a5a0a28b63
      - name: Build and test KnowGraphGo PTC adapter
        working-directory: KnowGraphGo
        run: |
          go test ./adapter/ptc/... -v
          go build ./cmd/ptcgraph
          go build ./cmd/knowgraph
      - name: Run cross-repository PTC E2E and replay
        run: python scripts/ptc_cross_repo_e2e.py --knowgraph-repo KnowGraphGo

  ptc-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
