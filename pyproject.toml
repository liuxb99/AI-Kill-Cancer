[project]
name = "ai-kill-cancer"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "pydantic==2.13.4",
  "python-multipart==0.0.19",
  "asyncpg==0.31.0",
  "sqlalchemy[asyncio]==2.0.36",
  "aiosqlite==0.20.0",
  "bcrypt==4.2.1",
  "PyJWT==2.10.1",
  "alembic==1.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["node_modules", "dist", ".git", "venv", "__pycache__"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I"]
ignore = ["E501"]
