# 場景規則
scenes:
  - id: feature-dev
    name: 功能開發
    description: 新功能模組的完整開發流程
    roles:
      - planner: 制定執行計劃
      - backend-logic: 後端業務邏輯
      - api-designer: API 設計
      - db-modeler: 資料庫建模
      - frontend-logic: 前端業務邏輯
      - unit-tester: 單元測試
      - integration-tester: 整合測試
      - doc-writer: 文件撰寫
      - reviewer: 評分代理
    workflow:
      - Step 0B: 接收需求
      - Step 1: 場景識別
      - Step 2: PLANNER 制定計劃
      - Step 3: 更新 Workflow
      - Step 4: 執行開發
      - Step 4b: 需求回歸檢查
      - Step 5: REVIEWER 評分
      - Step 5b: 返工循環（必要時）
      - Step 6: 總結報告

  - id: bug-fix
    name: 錯誤修復
    description: 修復既有功能的錯誤
    roles:
      - planner: 制定修復計劃
      - backend-logic: 後端修復（如適用）
      - frontend-logic: 前端修復（如適用）
      - unit-tester: 測試驗證
      - reviewer: 評分代理

  - id: devops
    name: DevOps / 部署
    description: CI/CD、部署、基礎設施
    roles:
      - planner: 規劃部署步驟
      - devops: 部署執行
      - reviewer: 驗證確認

  - id: hardening
    name: 架構強化
    description: 修正既有功能的架構問題、邊界案例驗證、審計追蹤補全
    roles:
      - planner: 制定強化計劃與優先級排序
      - backend-logic: 後端邏輯修正（validation、audit trail）
      - frontend-logic: 前端邏輯修正（navigation、sample data 移除）
      - test-writer: 撰寫回歸測試驗證修正
      - reviewer: 評分代理

  - id: master-plan
    name: 大型規劃與調研
    description: 制定大型 Master Plan、架構規劃、程式碼盤點、Gap Analysis，不修改 production code
    roles:
      - planner: 制定整體規劃與 Batch 拆分
      - doc-writer: 撰寫規劃文件、盤點報告、Gap Analysis
      - explorer: 程式碼盤點與現況調查
      - reviewer: 評分代理
    workflow:
      - Step 0: 啟動子代理報到
      - Step 1: 接收需求
      - Step 2: 場景識別
      - Step 3: PLANNER 制定計劃
      - Step 4: 更新 Workflow
      - Step 5: 執行調研與規劃（子代理產出文件）
      - Step 6: 需求回歸檢查
      - Step 7: REVIEWER 評分
      - Step 8: 返工循環（必要時）
      - Step 9: 總結報告
